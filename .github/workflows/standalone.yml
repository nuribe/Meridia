name: Standalone

# Genera los ejecutables standalone (sidecar PyInstaller + app Tauri).
#
# - Cada commit en main: build de Windows y publicación en el pre-release
#   rodante "latest" (descargable desde la página de Releases sin login).
# - Tag v*: build de Windows + macOS + Linux y release versionado.
# - También se puede lanzar manualmente desde la pestaña Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

# Un push nuevo a main cancela el build anterior si aún corre.
concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # crear/actualizar releases

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # En main solo Windows (rápido y barato); con tag v*, las 3 plataformas.
      matrix:
        include: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '[{"os":"windows-latest","triple":"x86_64-pc-windows-msvc","exe":".exe"},{"os":"macos-latest","triple":"aarch64-apple-darwin","exe":""},{"os":"ubuntu-22.04","triple":"x86_64-unknown-linux-gnu","exe":""}]' || '[{"os":"windows-latest","triple":"x86_64-pc-windows-msvc","exe":".exe"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: las notas se generan del git log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable

      # Cada build lleva su propio número, aunque el tag del pre-release
      # rodante siga siendo "latest": la versión base de tauri.conf.json más
      # el número de ejecución del workflow, que crece solo y nunca se repite.
      # Con un tag v* se usa la versión limpia del tag.
      - name: Calcular la versión de la build
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${base}+build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versión de esta build: $version"

      - name: Cache de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: cargo-${{ matrix.triple }}-${{ hashFiles('app/src-tauri/Cargo.lock', 'app/src-tauri/Cargo.toml') }}

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Sidecar con PyInstaller
        working-directory: sidecar
        run: |
          pip install -e . pyinstaller
          pyinstaller --onefile --name pg-diagrammer-sidecar \
            --collect-all uvicorn --collect-all keyring \
            --collect-all psycopg --collect-all psycopg_binary \
            --collect-all pytds \
            --noconfirm --clean scripts/pyinstaller_entry.py
        shell: bash

      - name: Colocar sidecar para Tauri (externalBin)
        run: |
          mkdir -p app/src-tauri/binaries
          cp "sidecar/dist/pg-diagrammer-sidecar${{ matrix.exe }}" \
             "app/src-tauri/binaries/pg-diagrammer-sidecar-${{ matrix.triple }}${{ matrix.exe }}"
        shell: bash

      - name: Build Tauri
        working-directory: app
        # La versión viaja al bundle JS (import.meta.env) para que la app pueda
        # decir en qué build está corriendo.
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm run tauri build -- --config src-tauri/tauri.standalone.json
        shell: bash

      # Después de compilar, para que las notas listen los archivos reales
      # con su tamaño. El ZIP portable se crea a continuación e incluye este
      # archivo, así que este es el último punto en que puede generarse.
      - name: Documentar la build (NOVEDADES.md)
        shell: bash
        run: python scripts/release_notes.py --version "${{ steps.version.outputs.version }}"

      - name: ZIP portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "app/src-tauri/target/release"
          $portable = "dist-standalone/Meridia-portable-win64"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "$release/pg-diagrammer.exe" "$portable/Meridia.exe"
          Copy-Item "$release/pg-diagrammer-sidecar.exe" "$portable/pg-diagrammer-sidecar.exe"
          Copy-Item "dist-standalone/NOVEDADES.md" "$portable/NOVEDADES.md"
          Compress-Archive -Path "$portable/*" -DestinationPath "dist-standalone/Meridia-portable-win64.zip" -Force

      - name: Guardar artefactos del run
        uses: actions/upload-artifact@v4
        with:
          name: meridia-${{ matrix.triple }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            dist-standalone/*.zip
          if-no-files-found: warn

      # El tag sigue siendo "latest" (el enlace de descarga nunca cambia),
      # pero el nombre visible es el número de versión de esta build.
      - name: Publicar en el pre-release rodante (cada commit en main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Meridia ${{ steps.version.outputs.version }}
          prerelease: true
          body_path: dist-standalone/NOVEDADES.md
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            dist-standalone/Meridia-portable-win64.zip
            dist-standalone/NOVEDADES.md

      - name: Publicar release versionado (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Meridia ${{ steps.version.outputs.version }}
          body_path: dist-standalone/NOVEDADES.md
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            dist-standalone/Meridia-portable-win64.zip
            dist-standalone/NOVEDADES.md
