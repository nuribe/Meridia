name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sidecar-tests:
    name: Tests sidecar (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pgdiag
          POSTGRES_PASSWORD: pgdiag_ci
          POSTGRES_DB: pgdiag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgdiag"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PG_TEST_DSN: postgresql://pgdiag:pgdiag_ci@localhost:5432/pgdiag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        working-directory: sidecar
        run: pip install -e ".[dev]"
      - name: Ejecutar tests (unidad + integración)
        working-directory: sidecar
        run: pytest -v

  sidecar-build:
    name: Build sidecar (PyInstaller) — ${{ matrix.os }}
    needs: sidecar-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: pg-diagrammer-sidecar-linux
            binary: pg-diagrammer-sidecar
          - os: windows-latest
            artifact: pg-diagrammer-sidecar-windows
            binary: pg-diagrammer-sidecar.exe
          - os: macos-latest
            artifact: pg-diagrammer-sidecar-macos
            binary: pg-diagrammer-sidecar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        working-directory: sidecar
        run: pip install -e ".[dev]"
      - name: Empaquetar con PyInstaller
        working-directory: sidecar
        run: >
          pyinstaller --onefile --name pg-diagrammer-sidecar
          --paths src
          --hidden-import pg_diagrammer
          src/pg_diagrammer/main.py
      - name: Smoke test del binario (handshake)
        if: runner.os != 'Windows'
        working-directory: sidecar
        run: |
          PG_DIAGRAMMER_TOKEN=ci timeout 20 ./dist/${{ matrix.binary }} > handshake.log &
          sleep 8
          grep -q '"port"' handshake.log
      - name: Smoke test del binario (handshake, Windows)
        if: runner.os == 'Windows'
        working-directory: sidecar
        shell: pwsh
        run: |
          $env:PG_DIAGRAMMER_TOKEN = "ci"
          $p = Start-Process -FilePath "dist/${{ matrix.binary }}" -RedirectStandardOutput handshake.log -PassThru -NoNewWindow
          Start-Sleep -Seconds 10
          Stop-Process -Id $p.Id -Force
          if (-not (Select-String -Path handshake.log -Pattern '"port"')) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: sidecar/dist/${{ matrix.binary }}

  app-build:
    name: Build Tauri — ${{ matrix.os }}
    needs: sidecar-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential
      - name: Instalar dependencias npm
        working-directory: app
        run: npm install
      - name: Compilar frontend + shell (sin bundle, faltan iconos)
        working-directory: app
        run: |
          npm run build
          cd src-tauri && cargo check --locked || cargo check
